<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Table Plus playground</title>
    <link rel="stylesheet" href="playground.css" />
  </head>
  <body>
    <header>
      <strong>Table Plus<span class="long"> playground</span></strong>
      <span class="hint">Mock SilverBullet: markdown on the left, rendered page on the right</span>
      <span class="spacer"></span>
      <!-- On a narrow screen the buttons show their icon alone -->
      <button id="settings-toggle" type="button" aria-pressed="true" title="Show or hide the settings"><span class="icon">⚙</span><span class="label">Settings</span></button>
      <button id="markdown" type="button" aria-pressed="true" title="Show or hide the markdown"><span class="icon">M↓</span><span class="label">Markdown</span></button>
      <button id="reset" type="button" title="Reset sample"><span class="icon">↺</span><span class="label">Reset sample</span></button>
      <button id="theme" type="button" title="Dark / light"><span class="icon">◐</span><span class="label">Dark / light</span></button>
    </header>
    <aside id="settings"></aside>
    <main>
      <section class="pane markdown-pane">
        <h2>Markdown</h2>
        <textarea id="source" spellcheck="false"></textarea>
      </section>
      <section class="pane">
        <h2>Page</h2>
        <!-- SilverBullet's layout: the top bar above the editor, the page scrolling in CodeMirror's scroller -->
        <div id="sb-root">
          <div id="sb-top">
            <div class="main">
              <div class="inner"><div class="wrapper"><span id="sb-current-page">Playground</span></div></div>
            </div>
          </div>
          <div id="sb-main">
            <div id="sb-editor">
              <div class="cm-editor">
                <div id="scroller" class="cm-scroller">
                  <div id="page" class="cm-content" tabindex="0"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div id="flash"></div>
    <script type="module" src="playground.js"></script>
  </body>
</html>
